name: Refresh Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas lxml

      - name: Build org data
        run: python ai-io-site/scripts/build_data.py

      - name: Build actions data
        env:
          DISCOVERY_BATCH_SIZE: "18"
        run: python ai-io-site/scripts/build_actions.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-io-site/data ai-io-site/config .github/workflows
          git diff --cached --quiet || git commit -m "chore: refresh organization and actions data"
          git push

